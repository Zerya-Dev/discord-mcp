[project]
name = "zerya-discord-mcp"
version = "1.0.0"
description = "Permission-aware search over your Discord history for Claude and other AI agents (MCP server library)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zerya", email = "us@zerya.dev" }]
keywords = ["discord", "mcp", "model-context-protocol", "claude", "ai-agents", "search", "full-text-search", "hikari"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
requires-python = ">=3.14, <3.15"
dependencies = [
    "hikari>=2.7",
    "pydantic>=2.13",
    "pydantic-settings>=2.16",
    "rapidfuzz>=3.14",
    "simplemma>=2.0",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/Zerya-Dev/discord-mcp"
Documentation = "https://github.com/Zerya-Dev/discord-mcp#readme"
Issues = "https://github.com/Zerya-Dev/discord-mcp/issues"
Changelog = "https://github.com/Zerya-Dev/discord-mcp/blob/main/CHANGELOG.md"

[project.scripts]
zdm-dev = "zerya_discord_mcp.testing.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
    "starlette>=1.0",
]

[build-system]
requires = ["uv_build>=0.11.26, <0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zerya_discord_mcp"
module-root = ""
wheel-exclude = ["zerya_discord_mcp/tests"]
