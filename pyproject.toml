[project]
name = "zerya-discord-mcp-workspace"
version = "1.0.0"
description = "Workspace root for zerya-discord-mcp and its standalone bot"
requires-python = ">=3.14, <3.15"
dependencies = [
    "zerya-discord-mcp[arc,mcp]",
    "zerya-discord-mcp-bot",
]

[dependency-groups]
prod = []
dev = [
    "pytest>=9.1.1, <9.2",
    "pytest-asyncio>=1.4.0, <1.5",
    "ruff>=0.15.20, <0.16",
    "pre-commit>=4.6.0, <4.7",
    "pyrefly>=1.1.1,<1.2.0",
    "pyyaml>=6.0.3, <6.1",
    "import-linter>=2.17,<2.18",
]

[tool.uv]
package = false
add-bounds = "minor"
default-groups = ["dev"]
# We need 0.11.26 for preview-features config
required-version = ">=0.11.26"
preview-features = ["audit-command", "format-command"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
zerya-discord-mcp = { workspace = true }
zerya-discord-mcp-bot = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/zerya-discord-mcp/zerya_discord_mcp/tests",
    "packages/zerya-discord-mcp-bot/zerya_discord_mcp_bot/tests",
    "examples/tests",
]
asyncio_mode = "auto"
markers = ["install: installs the built wheel into fresh virtualenvs (slow, needs the package index or uv's cache)"]
addopts = "-m 'not install'"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade (modern Python syntax)
    "N", # PEP8 Naming
]

[tool.pyrefly]
preset = "strict"
project-includes = ["packages/**/*.py", "examples/**/*.py"]
search-path = [".", "packages/zerya-discord-mcp", "packages/zerya-discord-mcp-bot"]

[tool.ruff.lint.isort]
known-first-party = ["zerya_discord_mcp", "zerya_discord_mcp_bot"]

# Module boundaries, checked by `lint-imports` (just lint, CI).
[tool.importlinter]
root_packages = ["zerya_discord_mcp", "zerya_discord_mcp_bot"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core is independent of the arc and MCP integrations and their dependencies"
type = "forbidden"
source_modules = [
    "zerya_discord_mcp.access",
    "zerya_discord_mcp.commands",
    "zerya_discord_mcp.config",
    "zerya_discord_mcp.core",
    "zerya_discord_mcp.diagnostics",
    "zerya_discord_mcp.i18n",
    "zerya_discord_mcp.index",
    "zerya_discord_mcp.ingest",
    "zerya_discord_mcp.query",
    "zerya_discord_mcp.ratelimit",
    "zerya_discord_mcp.testing",
    "zerya_discord_mcp.text",
]
forbidden_modules = ["zerya_discord_mcp.arc", "zerya_discord_mcp.mcp", "arc", "mcp", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Integrations do not depend on each other"
type = "independence"
modules = ["zerya_discord_mcp.arc", "zerya_discord_mcp.mcp"]

[[tool.importlinter.contracts]]
name = "The arc plugin is an adapter over the public core and the commands"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["zerya_discord_mcp.arc"]
forbidden_modules = [
    "zerya_discord_mcp.access",
    "zerya_discord_mcp.index",
    "zerya_discord_mcp.ingest",
    "zerya_discord_mcp.query",
    "mcp",
    "starlette",
]

[[tool.importlinter.contracts]]
name = "The index and the query engine never touch Discord"
type = "forbidden"
source_modules = ["zerya_discord_mcp.index", "zerya_discord_mcp.query"]
forbidden_modules = ["hikari"]

[[tool.importlinter.contracts]]
name = "The standalone bot uses only the public API"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["zerya_discord_mcp_bot"]
forbidden_modules = [
    "zerya_discord_mcp.access",
    "zerya_discord_mcp.commands",
    "zerya_discord_mcp.core",
    "zerya_discord_mcp.diagnostics",
    "zerya_discord_mcp.index",
    "zerya_discord_mcp.ingest",
    "zerya_discord_mcp.query",
    "zerya_discord_mcp.testing",
    "zerya_discord_mcp.arc._plugin",
    "zerya_discord_mcp.mcp._app",
    "zerya_discord_mcp.mcp._login",
    "zerya_discord_mcp.mcp._oauth",
    "zerya_discord_mcp.mcp._principal",
    "zerya_discord_mcp.mcp._tools",
]
