[project]
name = "zerya-discord-mcp-workspace"
version = "0.1.0"
description = "Workspace root for zerya-discord-mcp and its standalone bot"
requires-python = ">=3.14, <3.15"
dependencies = [
    "zerya-discord-mcp[mcp]",
    "zerya-discord-mcp-bot",
]

[dependency-groups]
prod = []
dev = [
    "pytest>=9.1.1, <9.2",
    "pytest-asyncio>=1.4.0, <1.5",
    "ruff>=0.15.20, <0.16",
    "pre-commit>=4.6.0, <4.7",
    "pyrefly>=1.1.1,<1.2.0",
    "pyyaml>=6.0.3, <6.1",
]

[tool.uv]
package = false
add-bounds = "minor"
default-groups = ["dev"]
# We need 0.11.26 for preview-features config
required-version = ">=0.11.26"
preview-features = ["audit-command", "format-command"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
zerya-discord-mcp = { workspace = true }
zerya-discord-mcp-bot = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/zerya-discord-mcp/zerya_discord_mcp/tests", "packages/zerya-discord-mcp-bot/zerya_discord_mcp_bot/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade (modern Python syntax)
    "N", # PEP8 Naming
]

[tool.pyrefly]
preset = "strict"
project-includes = ["packages/**/*.py"]
search-path = ["packages/zerya-discord-mcp", "packages/zerya-discord-mcp-bot"]

[tool.ruff.lint.isort]
known-first-party = ["zerya_discord_mcp", "zerya_discord_mcp_bot"]
